services:
  hodor_db:
    container_name: hodor_postgresdb
    image: postgres:17
    restart: always
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB

  hodor_cache:
    container_name: hodor_rediscache
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data

  hodor_api:
    container_name: hodor_api
    build: .
    ports:
      - "5000:80"
    depends_on:
      hodor_db:
        condition: service_healthy
      hodor_cache:
        condition: service_healthy

  hodor_web:
    container_name: hodor_nginxweb
    image: nginx:alpine
    ports:
      - "8000:80"
    depends_on:
      - hodor_api
    volumes:
      - ./pages:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
  redisdata:
